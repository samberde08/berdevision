<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BerdeVision player</title>
<style>html,body{margin:0;height:100%;background:#000}video{width:100%;height:100%;display:block;object-fit:contain;background:#000}</style></head><body>
<video id="v" controls autoplay playsinline></video>
<script>(function(){var f=(/[?&]f=([^&]+)/.exec(location.search)||[])[1];if(!f)return;f=decodeURIComponent(f);if(!/^films\/[\w.-]+\.mp4$/.test(f))return;
var v=document.getElementById("v");v.src=f;var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;v.play();});
v.addEventListener("timeupdate",function(){if(v.currentTime>0.12&&!v._t){v._t=1;try{parent.postMessage({bvPlaying:1},location.origin);}catch(e){}}});})();</script></body></html>
